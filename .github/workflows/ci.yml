name: CI tecnico

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-tecnico-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar-template:
    name: ci-tecnico
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe YAML dos workflows
        run: |
          ruby -e 'require "psych"; Dir.glob(".github/workflows/*.{yml,yaml}").each { |f| Psych.parse_file(f); puts "OK: #{f}" }'
      - name: Validar arquivos e regras essenciais
        run: |
          test -s LICENSE
          test -s .gitignore
          git check-ignore --no-index -q .env
          git check-ignore --no-index -q node_modules/exemplo
          git check-ignore --no-index -q target/exemplo
          if git check-ignore --no-index -q .env.example; then
            echo '.env.example deve poder ser versionado' >&2
            exit 1
          fi

  testes-sonar:
    name: Testes Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - validar-template
    if: always()
    steps:
      - name: Registrar Sonar como não aplicável
        run: |
          {
            echo '## Testes Sonar'
            echo
            echo 'Análise Sonar: **N/A** — este repositório não possui integração Sonar configurada; este check depende da validação documental e de configuração executada por `ci-tecnico`.'
            echo
            echo 'A validação documental e de configuração é executada pelo job `ci-tecnico`.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Exigir sucesso da validação técnica
        env:
          VALIDACAO_RESULTADO: ${{ needs.validar-template.result }}
        run: |
          if [ "$VALIDACAO_RESULTADO" != "success" ]; then
            echo "O gate Testes Sonar exige sucesso em ci-tecnico; resultado: $VALIDACAO_RESULTADO" >&2
            exit 1
          fi

  report-ci:
    name: Reportar resultado do CI na PR
    if: always() && github.event_name == 'pull_request'
    needs:
      - validar-template
      - testes-sonar
    uses: delta-app-ofc/.github/.github/workflows/report_ci.yml@d30cc2161336efb9ed9d9b49524a373fe3cafd03
    with:
      needs_results: ${{ toJSON(needs) }}
    secrets:
      DELTA_ORG_AUTOMATION_TOKEN: ${{ secrets.DELTA_ORG_AUTOMATION_TOKEN }}
    permissions:
      actions: read
      issues: write
      pull-requests: write
